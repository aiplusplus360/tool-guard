[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-guard"
version = "0.1.0"
description = "Sandbox agent tool calls: per-call timeouts, allowlists, call/time/cost budgets, and loop detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []

[project.scripts]
tool-guard = "toolguard.cli:main"

[tool.setuptools.packages.find]
include = ["toolguard*"]
